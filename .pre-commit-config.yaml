repos:
  # 1. Ruff 代码检查与格式化 (使用官方高能 Hook)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # 2. Mypy 静态类型检查 (直接使用项目的 uv 环境，规避缺少依赖问题)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict type check)
        entry: uv run mypy
        language: system
        types: [python]
        args: [--config-file=pyproject.toml]
        pass_filenames: false