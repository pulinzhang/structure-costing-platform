{% extends "base.html" %}

{% block title %}设置{% endblock %}

{% block page_title %}系统设置{% endblock %}

{% block breadcrumb_item %}设置{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
    {# 左侧：设置分类 #}
    <div class="lg:col-span-1">
        <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50">
                <h5 class="text-sm font-semibold text-slate-700 mb-0">设置分类</h5>
            </div>
            <nav class="divide-y divide-slate-100">
                <a href="#general"
                   class="flex items-center gap-2 px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                    <i class="bi bi-gear text-slate-400"></i>
                    基本设置
                </a>
                <a href="#costing"
                   class="flex items-center gap-2 px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                    <i class="bi bi-calculator text-slate-400"></i>
                    核价参数
                </a>
                <a href="#upload"
                   class="flex items-center gap-2 px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                    <i class="bi bi-upload text-slate-400"></i>
                    上传设置
                </a>
                <a href="#export"
                   class="flex items-center gap-2 px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                    <i class="bi bi-download text-slate-400"></i>
                    导出设置
                </a>
            </nav>
        </div>
    </div>

    {# 右侧：设置内容 #}
    <div class="lg:col-span-3 space-y-6">
        {# 基本设置 #}
        <div id="general" class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center gap-2">
                <i class="bi bi-gear text-slate-400"></i>
                <h5 class="text-sm font-semibold text-slate-700 mb-0">基本设置</h5>
            </div>
            <div class="p-4 space-y-4">
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-slate-700">系统名称</label>
                    <input type="text"
                           value="汽车冲压件自动核价平台"
                           class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-slate-700">公司名称</label>
                    <input type="text"
                           placeholder="请输入公司名称"
                           class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-slate-700">默认货币</label>
                    <select class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                        <option value="CNY" selected>人民币 (CNY)</option>
                        <option value="USD">美元 (USD)</option>
                        <option value="EUR">欧元 (EUR)</option>
                    </select>
                </div>

                <hr class="border-slate-200">

                <button class="inline-flex items-center justify-center gap-2 bg-slate-900 text-white rounded-md px-4 py-2 text-sm font-medium hover:bg-slate-800 transition-colors">
                    <i class="bi bi-check-lg"></i>
                    保存设置
                </button>
            </div>
        </div>

        {# 核价参数 #}
        <div id="costing" class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center gap-2">
                <i class="bi bi-calculator text-slate-400"></i>
                <h5 class="text-sm font-semibold text-slate-700 mb-0">核价参数</h5>
            </div>
            <div class="p-4 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium text-slate-700">默认材料价格 (元/kg)</label>
                        <input type="number"
                               value="10.00"
                               step="0.01"
                               class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium text-slate-700">默认工时费率 (元/小时)</label>
                        <input type="number"
                               value="50.00"
                               step="0.01"
                               class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium text-slate-700">默认设备费率 (元/小时)</label>
                        <input type="number"
                               value="100.00"
                               step="0.01"
                               class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium text-slate-700">默认管理费率 (%)</label>
                        <input type="number"
                               value="15"
                               class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                    </div>
                </div>

                <hr class="border-slate-200">

                <button class="inline-flex items-center justify-center gap-2 bg-slate-900 text-white rounded-md px-4 py-2 text-sm font-medium hover:bg-slate-800 transition-colors">
                    <i class="bi bi-check-lg"></i>
                    保存参数
                </button>
            </div>
        </div>

        {# 上传设置 #}
        <div id="upload" class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center gap-2">
                <i class="bi bi-upload text-slate-400"></i>
                <h5 class="text-sm font-semibold text-slate-700 mb-0">上传设置</h5>
            </div>
            <div class="p-4 space-y-4">
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-slate-700">允许的文件类型</label>
                    <input type="text"
                           value=".xlsx, .xls, .csv"
                           readonly
                           class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-500 cursor-not-allowed">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-slate-700">最大文件大小 (MB)</label>
                    <input type="number"
                           value="50"
                           class="w-full h-9 px-3 text-sm border border-slate-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-300 transition-colors">
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox"
                           id="autoParse"
                           checked
                           class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900">
                    <label for="autoParse" class="text-sm text-slate-700">上传后自动解析数据</label>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
