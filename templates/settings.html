{% extends "base.html" %}

{% block title %}设置{% endblock %}

{% block page_title %}系统设置{% endblock %}

{% block breadcrumb_item %}设置{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-3">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">设置分类</h5>
            </div>
            <div class="list-group list-group-flush">
                <a href="#general" class="list-group-item list-group-item-action active">
                    <i class="bi bi-gear me-2"></i>基本设置
                </a>
                <a href="#costing" class="list-group-item list-group-item-action">
                    <i class="bi bi-calculator me-2"></i>核价参数
                </a>
                <a href="#upload" class="list-group-item list-group-item-action">
                    <i class="bi bi-upload me-2"></i>上传设置
                </a>
                <a href="#export" class="list-group-item list-group-item-action">
                    <i class="bi bi-download me-2"></i>导出设置
                </a>
            </div>
        </div>
    </div>

    <div class="col-lg-9">
        <!-- 基本设置 -->
        <div class="card mb-4" id="general">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-gear me-2"></i>基本设置</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">系统名称</label>
                    <input type="text" class="form-control" value="汽车冲压件自动核价平台">
                </div>
                <div class="mb-3">
                    <label class="form-label">公司名称</label>
                    <input type="text" class="form-control" placeholder="请输入公司名称">
                </div>
                <div class="mb-3">
                    <label class="form-label">默认货币</label>
                    <select class="form-select">
                        <option value="CNY" selected>人民币 (CNY)</option>
                        <option value="USD">美元 (USD)</option>
                        <option value="EUR">欧元 (EUR)</option>
                    </select>
                </div>
                <hr>
                <button class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>保存设置
                </button>
            </div>
        </div>

        <!-- 核价参数 -->
        <div class="card mb-4" id="costing">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-calculator me-2"></i>核价参数</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">默认材料价格 (元/kg)</label>
                            <input type="number" class="form-control" value="10.00" step="0.01">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">默认工时费率 (元/小时)</label>
                            <input type="number" class="form-control" value="50.00" step="0.01">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">默认设备费率 (元/小时)</label>
                            <input type="number" class="form-control" value="100.00" step="0.01">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">默认管理费率 (%)</label>
                            <input type="number" class="form-control" value="15">
                        </div>
                    </div>
                </div>
                <hr>
                <button class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>保存参数
                </button>
            </div>
        </div>

        <!-- 上传设置 -->
        <div class="card mb-4" id="upload">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-upload me-2"></i>上传设置</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">允许的文件类型</label>
                    <input type="text" class="form-control" value=".xlsx, .xls, .csv" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">最大文件大小 (MB)</label>
                    <input type="number" class="form-control" value="50">
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="autoParse" checked>
                    <label class="form-check-label" for="autoParse">
                        上传后自动解析数据
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
