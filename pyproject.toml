[project]
name = "stamping-costing-platform"
version = "1.0.0"
description = "汽车冲压件自动核价平台 - Stamping Costing Platform"
authors = [
    {name = "Development Team"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "ruff>=0.1.15",
    "mypy>=1.8.0",
    # 补充第三方库的类型存根
    "types-openpyxl>=3.1.0",
    "types-Pillow>=10.0.0",
    "types-python-multipart>=0.0.6",
    "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
# 开启所有核心严格检查开关
strict = true

# 强制要求所有函数和方法必须有明确的类型定义（哪怕返回 None 也必须写 -> None）
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 禁止隐式的 Any 类型（防止类型退化成动态类型）
warn_return_any = true
warn_unreachable = true

# 严格禁止漏掉类型注解的函数调用
disallow_untyped_calls = true

# 允许针对第三方库无类型声明时的提示配置
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# 针对特定第三方库做容错（须用双括号数组）
[[tool.mypy.overrides]]
module = [
    "openpyxl",
    "openpyxl.*",
    "pandas",
    "pandas.*",
    "xlrd",
    "xlrd.*",
]
ignore_missing_imports = true

# Excel / openpyxl：Worksheet 常被标成 Optional，union-attr 噪音极大
[[tool.mypy.overrides]]
module = [
    "app.services.yishiyiyi.scrap_price.export.*",
    "app.services.yishiyiyi.base_price.export.*",
    "app.services.yishiyiyi.policy.export.*",
    "app.services.yishiyiyi.winning_thickness.export.*",
    "app.services.stamping.stamping_process_fee_export_service",
    "app.services.stamping.tonnage_price_export_service",
    "app.services.stamping.tonnage_price_import_service",
    "app.services.costing.steel_price.steel_price_export_service",
    "app.services.settings.logs.operation_log_service",
    "app.services.costing.stamping_part_cost.export.*",
    "app.parsers.stamping.stamping_parser",
    "app.parsers.stamping.excel_context",
    "app.parsers.stamping.image_handler",
    "app.parsers.bom.bom_parser",
]
disable_error_code = ["union-attr", "index"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
