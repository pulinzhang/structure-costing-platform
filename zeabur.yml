# Zeabur 服务配置
# 文档: https://zeabur.com/docs

# 服务名称（显示在 Zeabur 面板）
name: stamping-costing-platform

# 服务区域（可选）
# region: auto  # 自动选择最近区域
region:
  - hag-1  # 上海
  - tyo-1  # 日本（备选）

# 构建配置
build:
  # 使用 Docker 构建
  engine: docker
  
# 端口配置
expose:
  # 容器内部端口
  port: 8000

# 环境变量（可选）
env:
  # ENV: production
  # DEBUG: "false"
