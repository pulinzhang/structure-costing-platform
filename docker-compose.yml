# 云主机手工发版：在仓库根目录反复执行 bash deploy.sh 即可
# 映射宿主机 8000（可用 STAMPING_PUBLISH_PORT 改端口）
# Nginx 若也在 Docker 内：proxy_pass 用宿主机网关，例如 http://172.17.0.1:8000
# （不要用容器内的 127.0.0.1）。同网络也可用 http://stamping-costing-platform:8000
# 每次发版替换容器；./data ./uploads ./logs 挂卷保留，不会被重建清空

name: stamping-costing-platform

services:
  stamping-costing-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: stamping-costing-platform:local
    container_name: stamping-costing-platform
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${STAMPING_PUBLISH_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ./data:/opt/stamping-costing-platform/data
      - ./uploads:/opt/stamping-costing-platform/uploads
      - ./logs:/opt/stamping-costing-platform/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 1g
