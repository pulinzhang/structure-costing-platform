<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总成核价计算报告</title>
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">
    <link href="/static/css/fonts.css?v=1" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F4F4F5;
            --paper: #FFFFFF;
            --elevated: #FAFAFA;
            --ink: #18181B;
            --muted: #52525B;
            --dim: #71717A;
            --numeric: #3F3F46;
            --line: #E4E4E7;
            --border: #D4D4D8;
            --partial: #C2410C;
            --failed: #B91C1C;
            --skipped: #71717A;
            --brabus-red: #d32f2f;
            --brabus-red-hover: #b71c1c;
            --brabus-red-soft: #FEF2F2;
            --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            background: var(--bg-canvas);
            color: var(--ink);
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::selection {
            background: var(--brabus-red-soft);
            color: var(--ink);
        }
        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 48px 64px 80px;
        }
        .sheet {
            background: var(--paper);
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(10, 10, 10, 0.06);
        }
        header.report-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 36px 48px 24px;
            border-bottom: 3px solid var(--brabus-red);
        }
        header.report-head p {
            margin: 0 0 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--brabus-red);
        }
        header.report-head h1 {
            margin: 0;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .report-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .report-actions button {
            height: 36px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .report-actions button:hover {
            border-color: var(--muted);
        }
        .report-actions button:disabled {
            opacity: 0.55;
            cursor: wait;
        }
        .report-actions .btn-export {
            border-color: var(--brabus-red);
            background: var(--brabus-red);
            color: #fff;
        }
        .report-actions .btn-export:hover {
            background: var(--brabus-red-hover);
            border-color: var(--brabus-red-hover);
        }
        .report-actions .btn-ghost {
            color: var(--muted);
        }
        .export-hint {
            font-size: 11px;
            color: var(--dim);
            max-width: 140px;
            line-height: 1.35;
        }
        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 20;
            padding: 10px 14px;
            background: var(--elevated);
            color: var(--ink);
            border: 1px solid var(--border);
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(10, 10, 10, 0.08);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        @media (max-width: 639.98px) {
            .toast {
                left: 12px;
                right: 12px;
                bottom: 12px;
            }
        }
        .toast.is-on { opacity: 1; transform: none; }
        .toast.is-error { background: var(--brabus-red); color: #fff; border-color: var(--brabus-red); }
        .meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px 24px;
            padding: 20px 48px;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }
        .meta strong {
            color: var(--ink);
            font-weight: 600;
            font-family: var(--mono);
            font-size: 12px;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 14px 48px;
            background: var(--elevated);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .filters input {
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
        }
        .filters input { min-width: 220px; }
        .filters input:focus {
            outline: none;
            border-color: var(--brabus-red);
        }
        .filters button {
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--paper);
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .filters button.is-on {
            border-color: var(--brabus-red);
            color: var(--brabus-red);
            background: var(--brabus-red-soft);
        }
        .filter-select { position: relative; }
        .filter-select-btn {
            position: relative;
            height: 34px;
            padding: 0 28px 0 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            min-width: 7.5rem;
            text-align: left;
        }
        .filter-select-btn::after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            transform: translateY(-70%) rotate(45deg);
        }
        .filter-select.is-open .filter-select-btn {
            border-color: var(--brabus-red);
            color: var(--brabus-red);
        }
        .filter-select-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            min-width: 100%;
            margin: 0;
            padding: 4px 0;
            list-style: none;
            background: var(--paper);
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(10, 10, 10, 0.08);
            z-index: 6;
        }
        .filter-select-menu[hidden] { display: none; }
        .filter-select-menu li {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-select-menu li.is-on {
            background: var(--brabus-red);
            color: #fff;
        }
        .filter-select-menu:hover li.is-on {
            background: transparent;
            color: var(--ink);
        }
        .filter-select-menu li:hover,
        .filter-select-menu li.is-on:hover {
            background: var(--brabus-red);
            color: #fff;
        }
        .body { padding: 24px 48px 48px; }
        .summary {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 13px;
        }
        .narrative {
            margin: 0 0 22px;
            padding: 16px 18px;
            background: var(--elevated);
            border: 1px solid var(--line);
            white-space: pre-wrap;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.65;
            color: var(--numeric);
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 13px;
        }
        col.col-seq { width: 8%; }
        col.col-short { width: 11%; }
        col.col-part { width: 17%; }
        col.col-status { width: 6%; }
        col.col-money { width: 8.5%; }
        col.col-missing { width: 5%; }
        col.col-note { width: 12.5%; }
        th {
            text-align: left;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }
        tbody tr:hover { background: var(--bg-canvas); }
        td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-family: var(--mono);
            color: var(--numeric);
            font-size: 12px;
        }
        td.seq {
            text-align: left;
            font-variant-numeric: tabular-nums;
            font-family: var(--mono);
            font-size: 12px;
            white-space: nowrap;
        }
        td.short-code {
            white-space: nowrap;
        }
        td.short-code .short-code-text {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.02em;
            color: var(--ink);
        }
        .restore-badge {
            display: inline-flex;
            align-items: center;
            margin-left: 6px;
            padding: 0;
            border: none;
            background: none;
            color: var(--dim);
            opacity: 0.35;
            vertical-align: 1px;
            line-height: 0;
            text-decoration: none;
        }
        .restore-badge svg {
            width: 12px;
            height: 12px;
            display: block;
        }
        .restore-badge:hover,
        tbody tr:hover .restore-badge {
            opacity: 0.7;
            color: var(--muted);
        }
        .part-number {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 12px;
        }
        .part-name {
            color: var(--dim);
            font-size: 12px;
            margin-top: 2px;
        }
        .status-ok { color: var(--dim); font-weight: 300; font-size: 9px; }
        .status-partial { color: var(--partial); font-weight: 600; }
        .status-failed { color: var(--failed); font-weight: 600; }
        .status-skipped { color: var(--skipped); }
        .empty, .error {
            padding: 48px 32px;
            text-align: center;
            color: var(--muted);
        }
        .error { color: var(--failed); }
        .count { font-size: 12px; color: var(--muted); margin-left: auto; }
        .missing { color: var(--brabus-red); font-size: 12px; }
        .print-page-banner { display: none; }
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 12mm 16mm 12mm;
                @bottom-center {
                    content: "第 " counter(page) " 页 / 共 " counter(pages) " 页";
                    font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
                    font-size: 9pt;
                    color: #71717A;
                }
            }
            html, body {
                background: #fff !important;
                color: #18181b;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .page {
                max-width: none;
                margin: 0;
                padding: 0;
            }
            .sheet {
                border: none;
                box-shadow: none;
            }
            .filters, .report-actions, .toast, .restore-badge { display: none !important; }
            header.report-head { display: none; }
            .print-page-banner { display: table-row; }
            .print-page-banner th {
                padding: 0 0 2.5mm;
                border-bottom: 2px solid var(--brabus-red);
                background: #fff;
                text-align: left;
                text-transform: none;
                letter-spacing: normal;
                color: var(--ink);
                vertical-align: bottom;
            }
            .print-running-head {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 12px;
                width: 100%;
            }
            .print-running-brand {
                display: flex;
                flex-direction: column;
                gap: 0.6mm;
                min-width: 0;
            }
            .print-running-brand .print-kicker {
                margin: 0;
                font-size: 7pt;
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--brabus-red);
                white-space: nowrap;
            }
            .print-running-brand strong {
                font-size: 11pt;
                font-weight: 700;
                letter-spacing: -0.02em;
                text-transform: none;
            }
            .print-running-meta {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 1mm 10px;
                font-size: 8pt;
                color: var(--muted);
                text-align: right;
                line-height: 1.35;
            }
            .print-running-meta span { white-space: nowrap; }
            .meta {
                padding: 3mm 0;
                font-size: 9pt;
                break-inside: avoid;
            }
            .body { padding: 2mm 0 0; }
            .narrative {
                font-size: 8.5pt;
                padding: 3mm 3.5mm;
                break-inside: avoid;
            }
            table { font-size: 8.5pt; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            th {
                padding: 2mm 1.5mm;
                font-size: 7pt;
                background: #fafafa;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            td { padding: 1.6mm 1.5mm; }
            tbody tr { break-inside: avoid; }
            tbody tr:hover { background: transparent; }
            .part-number, td.num, td.seq { font-size: 8pt; }
            td.short-code { font-size: 10pt; }
            td.short-code .short-code-text { font-size: 10pt; }
            a { color: inherit; text-decoration: none; }
        }
        @media screen and (max-width: 960px) {
            .page { padding: 16px 12px 40px; }
            header.report-head {
                padding: 20px 16px 16px;
                align-items: flex-start;
            }
            .report-actions {
                flex-wrap: wrap;
                width: 100%;
            }
            .export-hint { max-width: none; flex: 1 1 100%; }
            .meta { padding: 14px 16px; }
            .meta div { min-width: 0; }
            .meta strong { overflow-wrap: anywhere; }
            .filters { padding: 12px 16px; }
            .body { padding: 16px 12px 28px; }
            .narrative { overflow-wrap: anywhere; }
            #reportTableHost {
                overflow-x: auto;
                max-width: 100%;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-x: contain;
            }
            #reportTableHost table { min-width: 960px; }
            #reportTableHost table:has(td.empty) { min-width: 0; width: 100%; }
        }
        @media screen and (max-width: 640px) {
            header.report-head h1 { font-size: 22px; }
            .filters input {
                min-width: 0;
                flex: 1 1 100%;
                width: 100%;
            }
            #reportTableHost { overflow-x: visible; }
            #reportTableHost table,
            #reportTableHost table:has(td.empty) {
                display: block;
                min-width: 0;
                width: 100%;
            }
            #reportTableHost colgroup,
            #reportTableHost thead { display: none; }
            #reportTableHost tbody { display: block; }
            #reportTableHost tbody tr {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                column-gap: 12px;
                row-gap: 2px;
                padding: 14px 0;
                border-bottom: 1px solid var(--line);
            }
            #reportTableHost tbody tr:hover { background: transparent; }
            #reportTableHost td {
                display: block;
                width: auto;
                min-width: 0;
                border-bottom: none;
                padding: 2px 0;
                white-space: normal;
                overflow-wrap: anywhere;
            }
            #reportTableHost td.seq,
            #reportTableHost td.short-code { white-space: normal; }
            #reportTableHost td:nth-child(2) { grid-area: 1 / 1; }
            #reportTableHost td:nth-child(4) {
                grid-area: 1 / 2;
                align-self: center;
                text-align: right;
            }
            #reportTableHost td:nth-child(3) { grid-area: 2 / 1 / 3 / -1; }
            #reportTableHost td:nth-child(1) {
                grid-area: 3 / 1 / 4 / -1;
                color: var(--dim);
            }
            #reportTableHost td:nth-child(1)::before {
                content: "序号 ";
                color: var(--muted);
            }
            #reportTableHost td:nth-child(n + 5) {
                grid-column: 1 / -1;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
            }
            #reportTableHost td:nth-child(5) { grid-row: 4; }
            #reportTableHost td:nth-child(6) { grid-row: 5; }
            #reportTableHost td:nth-child(7) { grid-row: 6; }
            #reportTableHost td:nth-child(8) { grid-row: 7; }
            #reportTableHost td:nth-child(9) { grid-row: 8; }
            #reportTableHost td:nth-child(10) { grid-row: 9; }
            #reportTableHost td:nth-child(11) {
                grid-row: 10;
                display: block;
            }
            #reportTableHost td:nth-child(5)::before { content: "材料"; }
            #reportTableHost td:nth-child(6)::before { content: "焊接"; }
            #reportTableHost td:nth-child(7)::before { content: "应成本"; }
            #reportTableHost td:nth-child(8)::before { content: "间接费用"; }
            #reportTableHost td:nth-child(9)::before { content: "总费用"; }
            #reportTableHost td:nth-child(10)::before { content: "缺价"; }
            #reportTableHost td:nth-child(11)::before { content: "说明"; }
            #reportTableHost td:nth-child(n + 5)::before {
                flex: 0 0 auto;
                color: var(--muted);
                font-family: Inter, "Segoe UI", system-ui, sans-serif;
                font-size: 12px;
                font-weight: 400;
                letter-spacing: 0;
                text-transform: none;
            }
            #reportTableHost td:nth-child(5) {
                margin-top: 6px;
                padding-top: 8px;
                border-top: 1px solid var(--line);
            }
            #reportTableHost td:nth-child(9) { font-weight: 600; }
            #reportTableHost td:nth-child(11)::before {
                display: block;
                margin-bottom: 2px;
            }
            #reportTableHost td:empty { display: none; }
            #reportTableHost tr:has(td.empty) { display: block; }
            #reportTableHost td.empty {
                display: block;
                grid-area: auto;
                text-align: center;
                padding: 24px 0;
            }
            #reportTableHost td.empty::before { content: none; }
            .filter-select.is-open .filter-select-menu {
                position: fixed;
                left: 12px;
                right: 12px;
                top: auto;
                bottom: 12px;
                width: auto;
                min-width: 0;
                max-height: 46vh;
                overflow-y: auto;
                z-index: 30;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="sheet" id="reportRoot">
            <div class="empty">加载计算报告…</div>
        </div>
    </div>
    <div class="toast" id="reportToast" role="status"></div>
    <script src="/static/js/main.js?v=20"></script>
    <script type="module" src="/static/js/features/costing/assembly-cost/calc-report/boot.js?v=27"></script>
</body>
</html>
